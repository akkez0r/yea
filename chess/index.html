<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Play free chess in your browser — local 2-player or against a built-in AI. Full rules: castling, en passant, promotion, checkmate detection.">
  <meta name="theme-color" content="#05060d">
  <title>Chess — Jesper.live</title>
  <link rel="stylesheet" href="../style.css">
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4854590447352624" crossorigin="anonymous"></script>
  <style>
    .wrap { flex: 1; max-width: 1120px; margin: 0 auto; width: 100%; padding: 22px 16px 34px; }
    .layout { display: grid; grid-template-columns: minmax(0,1fr) 292px; gap: 22px; align-items: start; }
    @media (max-width: 880px) { .layout { grid-template-columns: 1fr; } }

    /* ── Controls ── */
    .controls {
      display: flex; flex-wrap: wrap; gap: 11px;
      align-items: center; margin-bottom: 18px;
    }
    .mode-toggle {
      display: flex;
      background: var(--bg2);
      backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 3px;
      gap: 3px;
    }
    .mode-toggle button {
      padding: 8px 18px;
      background: transparent; border: none;
      border-radius: 8px;
      color: var(--muted);
      font-weight: 600; font-size: 0.84rem;
      transition: background 0.25s, color 0.25s, box-shadow 0.25s;
    }
    .mode-toggle button.active {
      background: linear-gradient(135deg, var(--violet), #7b4ddb);
      color: #fff;
      box-shadow: 0 3px 16px rgba(160,107,255,0.42);
    }
    .ctrl-btn {
      padding: 9px 18px;
      background: var(--bg2);
      backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: 11px;
      font-weight: 600; font-size: 0.84rem;
      transition: border-color 0.22s, color 0.22s, transform 0.15s;
    }
    .ctrl-btn:hover { border-color: var(--border-hi); color: var(--accent); transform: translateY(-2px); }

    .status-banner {
      flex: 1; min-width: 175px; text-align: right;
      font-family: var(--head);
      font-size: 0.82rem; font-weight: 700; letter-spacing: 1.2px;
      color: var(--accent);
      text-shadow: 0 0 16px rgba(0,245,180,0.4);
    }
    .status-banner.check { color: var(--gold); text-shadow: 0 0 16px rgba(255,176,32,0.5); }
    .status-banner.mate  { color: var(--danger); text-shadow: 0 0 16px rgba(255,77,106,0.5); }
    @media (max-width: 620px) { .status-banner { text-align: left; width: 100%; } }

    /* ── Board ── */
    .board-frame {
      background: var(--bg2);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      aspect-ratio: 1;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      border-radius: 10px;
      overflow: hidden;
      user-select: none;
      box-shadow: 0 10px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(160,180,240,0.14);
    }
    .sq {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(26px, 5.7vw, 47px);
      line-height: 1;
      cursor: pointer;
      transition: background 0.14s;
    }
    .sq.light { background: #c3cbe0; }
    .sq.dark  { background: #46507a; }
    .sq .piece { z-index: 2; pointer-events: none; transition: transform 0.12s; }
    .sq .piece.w { color: #ffffff; text-shadow: 0 2px 5px rgba(0,0,0,0.75); }
    .sq .piece.b { color: #14161d; text-shadow: 0 1px 3px rgba(255,255,255,0.3); }
    .sq:hover .piece { transform: scale(1.07); }

    .sq.selected {
      background: rgba(0,245,180,0.6) !important;
      box-shadow: inset 0 0 22px rgba(0,245,180,0.7);
    }
    .sq.last-move::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(255,176,32,0.3);
    }
    .sq.move-dot::before {
      content: '';
      position: absolute;
      width: 27%; height: 27%;
      border-radius: 50%;
      background: rgba(0,245,180,0.8);
      box-shadow: 0 0 14px rgba(0,245,180,0.9);
      z-index: 1;
    }
    .sq.move-capture::before {
      content: '';
      position: absolute; inset: 6%;
      border: 3.5px solid rgba(255,77,106,0.9);
      border-radius: 50%;
      box-shadow: 0 0 14px rgba(255,77,106,0.6);
      z-index: 1;
    }
    .sq.in-check {
      background: rgba(255,77,106,0.75) !important;
      animation: checkFlash 1.1s ease-in-out infinite;
    }
    @keyframes checkFlash {
      0%,100% { box-shadow: inset 0 0 20px rgba(255,77,106,0.6); }
      50%     { box-shadow: inset 0 0 38px rgba(255,77,106,1); }
    }

    .sq .coord {
      position: absolute;
      font-size: 9px; font-weight: 700;
      opacity: 0.6; font-family: var(--body);
    }
    .sq .coord.file { right: 4px; bottom: 2px; }
    .sq .coord.rank { left: 4px; top: 2px; }
    .sq.light .coord { color: #46507a; }
    .sq.dark  .coord { color: #c3cbe0; }

    /* ── Side panel ── */
    .side { display: flex; flex-direction: column; gap: 16px; }
    .box {
      background: var(--bg2);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 17px;
    }
    .turn-row { display: flex; align-items: center; gap: 11px; font-weight: 600; }
    .turn-dot {
      width: 15px; height: 15px; border-radius: 50%;
      border: 2px solid var(--border);
      transition: box-shadow 0.3s;
    }
    .turn-dot.w { background: #fff; box-shadow: 0 0 14px rgba(255,255,255,0.6); }
    .turn-dot.b { background: #14161d; box-shadow: 0 0 14px rgba(0,0,0,0.8); }

    .captured-row {
      display: flex; flex-wrap: wrap; gap: 2px;
      font-size: 1.35rem; min-height: 30px;
    }
    .captured-row .piece.w { color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.7); }
    .captured-row .piece.b { color: #1b1e28; text-shadow: 0 1px 2px rgba(255,255,255,0.32); }

    .history-list {
      max-height: 300px; overflow-y: auto;
      font-size: 0.85rem; line-height: 1.9;
      font-variant-numeric: tabular-nums;
    }
    .history-list .move-row {
      display: grid; grid-template-columns: 34px 1fr 1fr; gap: 6px;
      padding: 0 4px; border-radius: 5px;
    }
    .history-list .move-row:hover { background: rgba(255,255,255,0.045); }
    .history-list .num { color: var(--muted); }
    .history-list .mv { font-weight: 600; }
    .history-empty { color: var(--muted); font-size: 0.85rem; }

    /* ── Promotion ── */
    .promo-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(3,4,10,0.82);
      backdrop-filter: blur(7px);
      z-index: 500;
      align-items: center; justify-content: center;
    }
    .promo-overlay.active { display: flex; }
    .promo-box {
      background: var(--solid2);
      border: 1px solid var(--accent);
      border-radius: 20px;
      padding: 26px 30px;
      text-align: center;
      box-shadow: 0 0 60px rgba(0,245,180,0.28);
      animation: riseIn 0.28s ease;
    }
    .promo-box h3 {
      font-family: var(--head); font-size: 0.88rem;
      letter-spacing: 1.4px; margin-bottom: 16px;
    }
    .promo-choices { display: flex; gap: 11px; }
    .promo-choices button {
      width: 68px; height: 68px;
      font-size: 2.5rem;
      background: var(--solid3);
      border: 1px solid var(--border);
      border-radius: 14px;
      transition: border-color 0.18s, transform 0.16s, box-shadow 0.18s;
    }
    .promo-choices button:hover {
      border-color: var(--accent);
      transform: translateY(-5px);
      box-shadow: 0 8px 24px rgba(0,245,180,0.35);
    }

    /* ── Game over ── */
    .gameover {
      display: none;
      margin-top: 16px;
      padding: 16px 20px;
      border-radius: 14px;
      text-align: center;
      font-family: var(--head);
      font-weight: 700; letter-spacing: 1.2px;
      background: rgba(0,245,180,0.09);
      border: 1px solid var(--accent);
      color: var(--accent);
      backdrop-filter: blur(10px);
      animation: riseIn 0.4s ease, glowPulse 2.6s ease-in-out infinite;
    }
    .gameover.active { display: block; }
  </style>
</head>
