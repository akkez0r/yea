<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CS Case Clicker — a free idle clicker game themed around CS2 cases. Click to earn Euros, buy cases, and grow your collection.">
  <title>CS Case Clicker — Jesper.live</title>
  <link rel="stylesheet" href="../style.css">
  <!-- Google AdSense: replace ca-pub-XXXXXXXXXXXXXXXX with your real publisher ID -->
  <script async src="https://pagead2.googleapis.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  <style>
    .game-wrap {
      flex: 1;
      max-width: 1180px;
      margin: 0 auto;
      width: 100%;
      padding: 0 16px 30px;
    }

    /* ── Stats Bar ── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      padding: 18px 0;
    }
    .stat-chip {
      background: linear-gradient(180deg, var(--bg2), var(--bg3));
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 18px;
    }
    .stat-chip .label {
      font-size: 0.66rem;
      font-family: var(--font-head);
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 3px;
    }
    .stat-chip .value {
      font-size: 1.35rem;
      font-weight: 700;
      font-family: var(--font-head);
      color: var(--text);
    }
    .stat-chip .value.euros { color: var(--gold); text-shadow: 0 0 16px rgba(245,166,35,0.4); }
    .stat-chip .value.epc { color: var(--accent); }
    .stat-chip .value.cases { color: #b794f6; }

    /* ── Columns ── */
    .columns {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      align-items: start;
    }
    @media (max-width: 820px) { .columns { grid-template-columns: 1fr; } }
    .left-col { display: flex; flex-direction: column; gap: 20px; }

    /* ── Clicker Area ── */
    .clicker-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      padding: 36px 20px 28px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 18px;
      position: relative;
      overflow: hidden;
    }
    .clicker-area::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(circle at 50% 42%, rgba(245,166,35,0.09) 0%, transparent 65%);
      pointer-events: none;
    }
    .clicker-container {
      width: 250px; height: 250px;
      display: flex; align-items: center; justify-content: center;
    }
    .case-btn {
      width: 210px; height: 210px;
      border: none; background: transparent; padding: 0;
      position: relative;
      transition: transform 0.08s;
      cursor: pointer; outline: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .case-btn img {
      width: 100%; height: 100%;
      border-radius: 14px;
      pointer-events: none; user-select: none;
      filter: drop-shadow(0 6px 24px rgba(245,166,35,0.4));
      transition: filter 0.2s;
    }
    .case-btn:hover img { filter: drop-shadow(0 6px 34px rgba(245,166,35,0.7)); }
    .case-btn:active { transform: scale(0.93); }
    .case-btn.clicked { animation: case-pop 0.18s ease; }
    @keyframes case-pop {
      0% { transform: scale(0.93); }
      60% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .clicker-hint { font-size: 0.82rem; color: var(--text-muted); letter-spacing: 0.4px; position: relative; }

    .euro-pop {
      position: fixed;
      font-family: var(--font-head);
      font-size: 1.15rem; font-weight: 700;
      color: var(--gold);
      text-shadow: 0 0 10px rgba(245,166,35,0.6);
      pointer-events: none; z-index: 9999;
      animation: pop-up 0.85s ease forwards;
    }
    @keyframes pop-up {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      70% { opacity: 1; transform: translateY(-58px) scale(1.15); }
      100% { opacity: 0; transform: translateY(-88px) scale(0.9); }
    }

    /* ── Bot warning ── */
    .bot-warning {
      display: none;
      position: absolute; inset: 0;
      background: rgba(20,8,10,0.8);
      border: 2px solid var(--danger);
      border-radius: 18px;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 6px;
      z-index: 10; text-align: center; padding: 20px;
      backdrop-filter: blur(6px);
    }
    .bot-warning.active { display: flex; }
    .bot-warning .warn-icon { font-size: 2.6rem; }
    .bot-warning .warn-title { font-family: var(--font-head); font-size: 1.05rem; color: var(--danger); font-weight: 700; letter-spacing: 1px; }
    .bot-warning .warn-msg { font-size: 0.85rem; color: var(--text-muted); }
    .warn-timer { font-family: var(--font-head); font-size: 2rem; color: var(--danger); font-weight: 900; }

    /* ── Inventory ── */
    .inventory-panel {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }
    .inventory-grid { display: flex; flex-wrap: wrap; gap: 10px; min-height: 56px; }
    .inv-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px; min-width: 86px;
      transition: border-color 0.2s, transform 0.15s;
    }
    .inv-item:hover { border-color: var(--accent); transform: translateY(-2px); }
    .inv-item img { width: 52px; height: 52px; object-fit: contain; }
    .inv-item .inv-name { font-size: 0.62rem; color: var(--text-muted); text-align: center; line-height: 1.3; max-width: 90px; }
    .inv-item .inv-count { font-family: var(--font-head); font-size: 0.82rem; font-weight: 700; color: var(--accent); }
    .inv-empty { color: var(--text-muted); font-size: 0.85rem; align-self: center; }

    /* ── Shop ── */
    .shop-panel {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      position: sticky;
      top: 80px;
    }
    .shop-header {
      padding: 15px 18px;
      border-bottom: 1px solid var(--border);
      font-family: var(--font-head);
      font-size: 0.72rem; letter-spacing: 2.5px;
      text-transform: uppercase; color: var(--text-muted);
      display: flex; justify-content: space-between; align-items: center;
    }
    .shop-list {
      max-height: min(620px, calc(100vh - 230px));
      overflow-y: auto;
      padding: 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .shop-item {
      display: grid;
      grid-template-columns: 58px 1fr auto;
      align-items: center; gap: 12px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      transition: border-color 0.2s;
    }
    .shop-item.affordable { border-color: rgba(0,229,160,0.35); }
    .shop-item.affordable:hover { border-color: var(--accent); }
    .shop-item img { width: 52px; height: 52px; object-fit: contain; }
    .shop-name { font-size: 0.84rem; font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .shop-details { font-size: 0.74rem; color: var(--text-muted); }
    .shop-cost { font-family: var(--font-head); font-size: 0.8rem; font-weight: 700; color: var(--gold); margin-top: 2px; }
    .shop-cost.can-afford { color: var(--accent); }
    .buy-btn {
      padding: 8px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.78rem; font-weight: 700;
      color: var(--text-muted);
      transition: all 0.2s; white-space: nowrap;
    }
    .buy-btn.can-afford { background: rgba(0,229,160,0.1); border-color: var(--accent); color: var(--accent); }
    .buy-btn.can-afford:hover { background: var(--accent); color: #02110b; }
    .buy-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .reset-link {
      font-size: 0.7rem; color: var(--text-muted);
      background: none; border: none; text-decoration: underline;
      letter-spacing: normal; text-transform: none; font-family: var(--font-body);
    }
    .reset-link:hover { color: var(--danger); }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="../" class="nav-brand">JESPER.LIVE</a>
    <div class="nav-links">
      <a href="../">Home</a>
      <a href="./" class="active">CS Clicker</a>
      <a href="../chess/">Chess</a>
    </div>
  </nav>

  <div class="game-wrap">
    <div class="stats-bar">
      <div class="stat-chip"><div class="label">Balance</div><div class="value euros" id="stat-euros">€ 0</div></div>
      <div class="stat-chip"><div class="label">Euros / Click</div><div class="value epc" id="stat-epc">€ 1</div></div>
      <div class="stat-chip"><div class="label">Cases Owned</div><div class="value cases" id="stat-cases">0</div></div>
      <div class="stat-chip"><div class="label">Total Clicks</div><div class="value" id="stat-clicks">0</div></div>
    </div>

    <div class="columns">
      <div class="left-col">
        <div class="clicker-area" id="clicker-area">
          <div class="clicker-container">
            <button class="case-btn" id="case-btn" title="Click to earn Euros!">
              <img id="case-img" alt="CS2 Case" draggable="false">
            </button>
          </div>
          <p class="clicker-hint">Click the case to earn Euros!</p>
          <div class="bot-warning" id="bot-warning">
            <div class="warn-icon">⚠️</div>
            <div class="warn-title">AUTO-CLICKER DETECTED</div>
            <div class="warn-msg">Inhuman click speed — earnings frozen.</div>
            <div class="warn-timer" id="warn-timer">5</div>
          </div>
        </div>

        <div class="inventory-panel">
          <div class="section-title">Your Collection</div>
          <div class="inventory-grid" id="inventory-grid"></div>
        </div>
      </div>

      <div class="shop-panel">
        <div class="shop-header">
          <span>Case Shop</span>
          <button class="reset-link" id="reset-btn">reset save</button>
        </div>
        <div class="shop-list" id="shop-list"></div>
      </div>
    </div>

    <!-- Ad slot — replace data-ad-client / data-ad-slot with your values -->
    <div class="ad-slot">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
           data-ad-slot="0000000000"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
      <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-links">
      <a href="../">Home</a>
      <a href="./">CS Case Clicker</a>
      <a href="../chess/">Chess</a>
      <a href="../privacy.html">Privacy Policy</a>
    </div>
    <p>© 2026 Jesper.live</p>
  </footer>

  <script>
  (() => {
    'use strict';

    const CASES = [
      { id: 'recoil',     name: 'Recoil Case',            cost: 10,    bonus: 1,
        image: 'https://community.akamai.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApdO4YmlhxYQknCRvCo04DEVlxkKgpot221FAR17PLfYQJD_9W7m5S0mvLwOq7c2GoI68Fw2bGVpN6t3FTk-hc4YW3wdY6LcoKBqVXsw-_s0Ma8u5iu1J-dkHpnF4U/360fx360f' },
      { id: 'revolution', name: 'Revolution Case',        cost: 50,    bonus: 5,
        image: 'https://community.akamai.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApdO4YmlhxYQknCRvCo04DEVlxkKgpot221FAR17PLfYQJD_9W7m5S0mvLwOq7cqWdQ-sJ0xOqTp9Ws2Afk8hY5Zm6mJoSLMlRoNAvR_VS9xL_nh8S8uMifziBmvygh4n7D30VgKqY/360fx360f' },
      { id: 'dreams',     name: 'Dreams & Nightmares',    cost: 200,   bonus: 20,
        image: 'https://community.akamai.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApdO4YmlhxYQknCRvCo04DEVlxkKgpot221FAR17PLfYQJD_9W7m5S0mvLwOq7c2GoI6sEsj3r0po9323gLt-RI4ZjzydIeVegFqNVuD-AK9wea606_u6JpbMXep/360fx360f' },
      { id: 'kilowatt',   name: 'Kilowatt Case',          cost: 750,   bonus: 75,
        image: 'https://community.akamai.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApdO4YmlhxYQknCRvCo04DEVlxkKgpot221FAR17PLfYQJD_9W7m5S0mvLwOq7c2DwA65Yt2-2Xp9732VS3phI5NTrwdY-VdlRqZRuD-gC_wO3n15K_up_AuHJr/360fx360f' },
      { id: 'fracture',   name: 'Fracture Case',          cost: 2500,  bonus: 250,
        image: 'https://community.akamai.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApdO4YmlhxYQknCRvCo04DEVlxkKgpot221FAR17PLfYQJD_9W7m5S0mvLwOq7c2GoI6sEsj3r0po9323lW_8hc4YW37d9ecIVoYA6D-FC9xO_q0JO7uszJnCc97XCg7fiMoX-IUYE/360fx360f' },
      { id: 'riptide',    name: 'Operation Riptide Case', cost: 10000, bonus: 1000,
        image: 'https://community.akamai.steamstatic.com/economy/image/-9a81dlWLwJ2UUGcVs_nsVtzdOEdtWwKGZZLQHTxDZ7I56KU0Zwwo4NUX4oFJZEHLbXH5ApdO4YmlhxYQknCRvCo04DEVlxkKgpot221FAR17PLfYQJD_9W7m5S0mvLwOq7c2GoI6sEsj3r0po9323lW_8hc4YW3yIdbcJQ46MV_Y-AC6w-q-m5e86s2lQV8/360fx360f' }
    ];

    const SAVE_KEY = 'csclicker_save_v1';
    const DEFAULT_STATE = { euros: 0, epc: 1, totalCases: 0, totalClicks: 0, inventory: {} };
    let state = loadState();

    // Anti-autoclicker
    let clickTimes = [];
    let lastClick = 0;
    let cooldown = 80;          // randomized after each click
    let frozen = false;
    let frozenUntil = 0;
    let warnInterval = null;
    let hitbox = { x: 0, y: 0 };

    const $ = id => document.getElementById(id);
    const caseBtn = $('case-btn'), caseImg = $('case-img');
    const botWarning = $('bot-warning'), warnTimer = $('warn-timer');

    buildShop();
    updateCaseImage();
    randomiseHitbox();
    render();

    caseBtn.addEventListener('click', e => {
      const now = Date.now();

      if (frozen) {
        if (now < frozenUntil) return;
        unfreeze();
      }

      // randomized cooldown between valid clicks
      if (now - lastClick < cooldown) return;

      // rate check: >10 clicks in any rolling second = bot
      clickTimes.push(now);
      clickTimes = clickTimes.filter(t => now - t <= 1000);
      if (clickTimes.length > 10) { freeze(5); return; }

      // hitbox check: click must land near the (slightly offset) case center
      const r = caseBtn.getBoundingClientRect();
      const cx = r.left + r.width / 2 + hitbox.x;
      const cy = r.top + r.height / 2 + hitbox.y;
      const dx = e.clientX - cx, dy = e.clientY - cy;
      if (dx * dx + dy * dy > 95 * 95) { randomiseHitbox(); return; }

      lastClick = now;
      cooldown = 70 + Math.random() * 50;   // 70–120 ms
      state.euros += state.epc;
      state.totalClicks++;

      spawnPop(e.clientX, e.clientY, state.epc);
      caseBtn.classList.remove('clicked');
      void caseBtn.offsetWidth;
      caseBtn.classList.add('clicked');
      randomiseHitbox();

      save();
      render();
    });

    function freeze(seconds) {
      frozen = true;
      frozenUntil = Date.now() + seconds * 1000;
      clickTimes = [];
      botWarning.classList.add('active');
      let left = seconds;
      warnTimer.textContent = left;
      clearInterval(warnInterval);
      warnInterval = setInterval(() => {
        left--;
        warnTimer.textContent = Math.max(left, 0);
        if (left <= 0) { clearInterval(warnInterval); unfreeze(); }
      }, 1000);
    }
    function unfreeze() {
      frozen = false;
      botWarning.classList.remove('active');
      clearInterval(warnInterval);
    }

    function randomiseHitbox() {
      hitbox.x = (Math.random() - 0.5) * 44;
      hitbox.y = (Math.random() - 0.5) * 44;
      caseImg.style.transform = `translate(${hitbox.x}px, ${hitbox.y}px)`;
    }

    function spawnPop(x, y, amount) {
      const el = document.createElement('div');
      el.className = 'euro-pop';
      el.textContent = '+€' + fmt(amount);
      el.style.left = (x - 22) + 'px';
      el.style.top = (y - 12) + 'px';
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }

    function buildShop() {
      const list = $('shop-list');
      list.innerHTML = '';
      CASES.forEach(c => {
        const el = document.createElement('div');
        el.className = 'shop-item';
        el.id = 'shop-' + c.id;
        el.innerHTML = `
          <img src="${c.image}" alt="${c.name}" loading="lazy">
          <div>
            <div class="shop-name">${c.name}</div>
            <div class="shop-details">+€${fmt(c.bonus)} per click</div>
            <div class="shop-cost" id="cost-${c.id}">€ ${fmt(c.cost)}</div>
          </div>
          <button class="buy-btn" id="buy-${c.id}">Buy</button>`;
        el.querySelector('button').addEventListener('click', () => buy(c.id));
        list.appendChild(el);
      });
    }

    function buy(id) {
      const c = CASES.find(x => x.id === id);
      if (!c || state.euros < c.cost) return;
      state.euros -= c.cost;
      state.epc += c.bonus;
      state.totalCases++;
      state.inventory[id] = (state.inventory[id] || 0) + 1;
      updateCaseImage();
      save();
      render();
    }

    // clicker shows your best owned case (or the starter Recoil)
    function updateCaseImage() {
      let best = CASES[0];
      for (const c of CASES) if ((state.inventory[c.id] || 0) > 0) best = c;
      caseImg.src = best.image;
    }

    function render() {
      $('stat-euros').textContent = '€ ' + fmt(Math.floor(state.euros));
      $('stat-epc').textContent = '€ ' + fmt(state.epc);
      $('stat-cases').textContent = fmt(state.totalCases);
      $('stat-clicks').textContent = fmt(state.totalClicks);

      // inventory
      const inv = $('inventory-grid');
      const owned = CASES.filter(c => (state.inventory[c.id] || 0) > 0);
      if (!owned.length) {
        inv.innerHTML = '<span class="inv-empty">No cases yet — buy your first one from the shop!</span>';
      } else {
        inv.innerHTML = owned.map(c => `
          <div class="inv-item">
            <img src="${c.image}" alt="${c.name}">
            <div class="inv-name">${c.name}</div>
            <div class="inv-count">×${state.inventory[c.id]}</div>
          </div>`).join('');
      }

      // shop affordability
      CASES.forEach(c => {
        const ok = state.euros >= c.cost;
        $('shop-' + c.id).classList.toggle('affordable', ok);
        $('cost-' + c.id).classList.toggle('can-afford', ok);
        const btn = $('buy-' + c.id);
        btn.classList.toggle('can-afford', ok);
        btn.disabled = !ok;
      });
    }

    $('reset-btn').addEventListener('click', () => {
      if (!confirm('Reset all progress? This cannot be undone.')) return;
      state = { ...DEFAULT_STATE, inventory: {} };
      localStorage.removeItem(SAVE_KEY);
      updateCaseImage();
      render();
    });

    function save() {
      try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (_) {}
    }
    function loadState() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) {
          const s = JSON.parse(raw);
          return { ...DEFAULT_STATE, ...s, inventory: s.inventory || {} };
        }
      } catch (_) {}
      return { ...DEFAULT_STATE, inventory: {} };
    }

    function fmt(n) {
      if (n >= 1e9) return (n / 1e9).toFixed(2).replace(/\.?0+$/, '') + 'B';
      if (n >= 1e6) return (n / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
      if (n >= 1e4) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
      return n.toLocaleString('en-US');
    }
  })();
  </script>
