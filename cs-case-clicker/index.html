<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CS Case Clicker — a free idle clicker game themed around CS2 cases. Click to earn Euros, buy cases, and grow your collection.">
  <meta name="theme-color" content="#05060d">
  <title>CS Case Clicker — Jesper.live</title>
  <link rel="stylesheet" href="../style.css">
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4854590447352624" crossorigin="anonymous"></script>
  <style>
    .wrap { flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; padding: 22px 16px 34px; }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat {
      position: relative;
      background: var(--bg2);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      overflow: hidden;
      animation: riseIn 0.5s ease both;
    }
    .stat::after {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--c, var(--accent));
      box-shadow: 0 0 14px var(--c, var(--accent));
    }
    .stat:nth-child(2) { animation-delay: .06s } .stat:nth-child(3) { animation-delay: .12s }
    .stat:nth-child(4) { animation-delay: .18s }
    .stat .label {
      font-family: var(--head);
      font-size: 0.62rem;
      letter-spacing: 1.9px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .stat .value {
      font-family: var(--head);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--c, var(--text));
    }
    .s-eur { --c: var(--gold); }
    .s-epc { --c: var(--accent); }
    .s-case{ --c: var(--violet); }
    .s-clk { --c: #7f8db0; }

    /* ── Layout ── */
    .cols { display: grid; grid-template-columns: 1fr 350px; gap: 20px; align-items: start; }
    @media (max-width: 840px) { .cols { grid-template-columns: 1fr; } }
    .left { display: flex; flex-direction: column; gap: 20px; }

    /* ── Clicker ── */
    .clicker {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 44px 20px 32px;
      background: var(--bg2);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .clicker::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 40%, rgba(255,176,32,0.12), transparent 62%);
      pointer-events: none;
    }
    /* rotating conic glow behind the case */
    .halo {
      position: absolute;
      width: 330px; height: 330px;
      top: 50%; left: 50%;
      margin: -165px 0 0 -165px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, transparent, rgba(255,176,32,0.28), transparent 42%, rgba(0,245,180,0.22), transparent 72%);
      filter: blur(28px);
      animation: spin 14s linear infinite;
      pointer-events: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .case-stage {
      width: 254px; height: 254px;
      display: flex; align-items: center; justify-content: center;
      position: relative; z-index: 1;
    }
    .case-btn {
      width: 212px; height: 212px;
      border: none; background: transparent; padding: 0;
      position: relative;
      cursor: pointer; outline: none;
      transition: transform 0.09s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .case-btn img {
      width: 100%; height: 100%;
      border-radius: 16px;
      pointer-events: none; user-select: none;
      filter: drop-shadow(0 8px 30px rgba(255,176,32,0.45));
      transition: filter 0.25s;
    }
    .case-btn:hover img { filter: drop-shadow(0 8px 42px rgba(255,176,32,0.8)); }
    .case-btn:active { transform: scale(0.93); }
    .case-btn.clicked { animation: pop 0.19s ease; }
    @keyframes pop {
      0% { transform: scale(0.93); } 58% { transform: scale(1.07); } 100% { transform: scale(1); }
    }
    .hint { font-size: 0.83rem; color: var(--muted); position: relative; z-index: 1; }

    .euro-pop {
      position: fixed;
      font-family: var(--head);
      font-size: 1.2rem; font-weight: 700;
      color: var(--gold);
      text-shadow: 0 0 14px rgba(255,176,32,0.8);
      pointer-events: none; z-index: 9999;
      animation: rise 0.9s ease forwards;
    }
    @keyframes rise {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      70%  { opacity: 1; transform: translateY(-62px) scale(1.18); }
      100% { opacity: 0; transform: translateY(-94px) scale(0.88); }
    }

    /* ── Bot warning ── */
    .bot-warning {
      display: none;
      position: absolute; inset: 0;
      background: rgba(24,6,12,0.86);
      border: 2px solid var(--danger);
      border-radius: 20px;
      align-items: center; justify-content: center;
      flex-direction: column; gap: 7px;
      z-index: 20; text-align: center; padding: 22px;
      backdrop-filter: blur(8px);
    }
    .bot-warning.active { display: flex; animation: riseIn 0.25s ease; }
    .warn-icon { font-size: 2.7rem; }
    .warn-title {
      font-family: var(--head); font-size: 1.02rem;
      color: var(--danger); font-weight: 700; letter-spacing: 1.4px;
    }
    .warn-msg { font-size: 0.85rem; color: var(--muted); }
    .warn-timer { font-family: var(--head); font-size: 2.1rem; color: var(--danger); font-weight: 900; }

    /* ── Inventory ── */
    .inv-panel {
      background: var(--bg2);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }
    .inventory-grid { display: flex; flex-wrap: wrap; gap: 11px; min-height: 54px; }
    .inv-item {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 13px; min-width: 88px;
      transition: border-color 0.22s, transform 0.22s;
    }
    .inv-item:hover { border-color: var(--border-hi); transform: translateY(-3px); }
    .inv-item img { width: 54px; height: 54px; object-fit: contain; }
    .inv-name { font-size: 0.62rem; color: var(--muted); text-align: center; line-height: 1.3; max-width: 92px; }
    .inv-count { font-family: var(--head); font-size: 0.82rem; font-weight: 700; color: var(--accent); }
    .inv-empty { color: var(--muted); font-size: 0.86rem; align-self: center; }

    /* ── Shop ── */
    .shop {
      background: var(--bg2);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      position: sticky; top: 82px;
      box-shadow: var(--shadow);
    }
    .shop-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      font-family: var(--head);
      font-size: 0.68rem; letter-spacing: 2.6px;
      text-transform: uppercase; color: var(--muted);
      display: flex; justify-content: space-between; align-items: center;
    }
    .shop-list {
      max-height: min(640px, calc(100vh - 240px));
      overflow-y: auto;
      padding: 11px;
      display: flex; flex-direction: column; gap: 9px;
    }
    .shop-item {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      align-items: center; gap: 12px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 13px;
      transition: border-color 0.22s, transform 0.22s;
    }
    .shop-item.affordable { border-color: rgba(0,245,180,0.4); }
    .shop-item.affordable:hover { border-color: var(--accent); transform: translateX(3px); }
    .shop-item img { width: 52px; height: 52px; object-fit: contain; }
    .shop-name { font-size: 0.85rem; font-weight: 600; margin-bottom: 2px; }
    .shop-details { font-size: 0.74rem; color: var(--muted); }
    .shop-cost {
      font-family: var(--head); font-size: 0.8rem;
      font-weight: 700; color: var(--gold); margin-top: 3px;
    }
    .shop-cost.can-afford { color: var(--accent); }
    .buy-btn {
      padding: 9px 15px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 0.78rem; font-weight: 700;
      color: var(--muted);
      transition: all 0.22s; white-space: nowrap;
    }
    .buy-btn.can-afford {
      background: rgba(0,245,180,0.1);
      border-color: var(--accent);
      color: var(--accent);
    }
    .buy-btn.can-afford:hover {
      background: var(--accent); color: #01130d;
      box-shadow: 0 0 18px rgba(0,245,180,0.5);
    }
    .buy-btn:disabled { opacity: 0.38; cursor: not-allowed; }

    .reset-link {
      font-size: 0.7rem; color: var(--muted);
      background: none; border: none; text-decoration: underline;
      letter-spacing: normal; text-transform: none; font-family: var(--body);
    }
    .reset-link:hover { color: var(--danger); }
  </style>
</head>
